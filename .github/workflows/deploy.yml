# Builds Breakbit and publishes it on GitHub Pages at its own domain (https://breakbit.app/)
# on every push to main. Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm lint
          pnpm test

      # The site lives at the root of its domain (Settings → Pages → Custom domain:
      # breakbit.app); the build validates the content catalog too.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /
          # Public address for link previews (a SITE_URL repository variable overrides it).
          SITE_URL: ${{ vars.SITE_URL || 'https://breakbit.app/' }}
          # Optional (Settings → Secrets and variables → Actions → Variables); unset hides each.
          # GoatCounter site code for anonymous usage counts (services/analytics.ts).
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
          # Where "Send feedback" leads (a form) and the contact address on /privacy.
          VITE_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      # GitHub Pages answers unknown paths with 404.html: the app itself, so deep links
      # (/progress, a notification's /pause/…) open the right screen.
      # Public pages linked from outside (stores, the landing) get a real copy, so they answer
      # 200 instead of the fallback's 404.
      - run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/privacy && cp dist/index.html dist/privacy/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # End-to-end tests against their own production build at the root (playwright.config.ts),
  # in parallel with the Pages build; nothing is published unless both pass.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both projects (phone and desktop) run in Chromium.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      # Traces of the failed tests: `pnpm exec playwright show-trace <trace.zip>`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
