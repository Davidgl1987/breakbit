# Builds Breakbit and publishes it on GitHub Pages (https://davidgl1987.github.io/breakbit/)
# on every push to main. Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm lint
          pnpm test

      # The site lives under /breakbit/; the build validates the content catalog too.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /breakbit/

      # GitHub Pages answers unknown paths with 404.html: the app itself, so deep links
      # (/breakbit/progress, a notification's /breakbit/pause/…) open the right screen.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # End-to-end tests against their own production build at the root (playwright.config.ts),
  # in parallel with the Pages build; nothing is published unless both pass.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both projects (phone and desktop) run in Chromium.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      # Traces of the failed tests: `pnpm exec playwright show-trace <trace.zip>`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
