<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e4" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Pausas de 1 a 3 minutos para moverte durante tu jornada. Gratis, sin cuenta y tus datos se quedan en tu dispositivo."
    />
    <link rel="canonical" href="%SITE_URL%" />
    <!-- Link previews (WhatsApp, LinkedIn, X…); the image comes from `pnpm og-image`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Breakbit" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Breakbit · Pausa. Muévete. Sigue." />
    <meta
      property="og:description"
      content="Pausas de 1 a 3 minutos para moverte durante tu jornada. Gratis y sin cuenta."
    />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Breakbit: Pausa. Muévete. Sigue. Un avatar pixelado celebra con confeti."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The mark in dark green for light browser chrome, in mint for dark. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/app-icons/favicon-32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/app-icons/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Breakbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Breakbit</title>
    <script>
      // Apply the last resolved theme before first paint (ThemeController keeps it in sync).
      try {
        var theme = localStorage.getItem('breakbit:theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
