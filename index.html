<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e4" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Pausas cortas para moverte durante tu jornada, sin salir de tu día."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The mark in dark green for light browser chrome, in mint for dark. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/app-icons/favicon-32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/app-icons/favicon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Breakbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Breakbit</title>
    <script>
      // Apply the last resolved theme before first paint (ThemeController keeps it in sync).
      try {
        var theme = localStorage.getItem('breakbit:theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
